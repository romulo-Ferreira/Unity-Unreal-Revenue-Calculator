<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ganhos Unity/Fab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .calculator {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .section-title {
            margin-top: 20px;
            font-weight: bold;
            color: #4CAF50;
        }
        .info-box {
            background-color: #e8f5e9;
            border-radius: 5px;
            padding: 8px;
            margin: 15px 0;
            font-size: 13px;
            border-left: 4px solid #4CAF50;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-total {
            margin-top: 20px;
            padding: 15px;
            background-color: #f1f8e9;
            border-radius: 5px;
            border-left: 5px solid #4CAF50;
            text-align: center;
        }
        .result-total h2 {
            margin-top: 0;
            color: #2e7d32;
            font-size: 18px;
        }
        .result-total .total-value {
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
            margin: 10px 0;
        }
        .result {
            margin-top: 15px;
            padding: 12px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border-left: 3px solid #4CAF50;
            font-size: 13px;
        }
        .result p {
            margin: 4px 0;
        }
        .cambio-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .cambio-input {
            flex: 1;
        }
        .atualizar-btn {
            background-color: #555;
            padding: 8px 12px;
            height: 36px;
            width: auto;
        }
        .status-msg {
            font-size: 12px;
            margin-top: 5px;
        }
        .success { color: #4CAF50; }
        .warning { color: #ff9800; }
        .fee-info { font-weight: bold; color: #e53935; }
        .details-toggle {
            background: none;
            border: none;
            color: #555;
            text-decoration: underline;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
            width: auto;
            padding: 0;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Calculadora de Ganhos Unity/Fab</h1>
        
        <div class="section-title">Unity Asset Store</div>
        <div class="input-group">
            <label for="unity-tipo">Tipo de Valor Unity:</label>
            <select id="unity-tipo">
                <option value="bruto">Valor Bruto (Descontar 30% da Unity)</option>
                <option value="liquido" selected>Já é Líquido (Recebido da Unity)</option>
            </select>
            <label for="unity-valor">Valor (USD):</label>
            <input type="number" id="unity-valor" placeholder="Ex: 100.00">
        </div>
        
        <div class="section-title">Fab (Epic Games)</div>
        <div class="input-group">
            <label for="fab-valor">Valor Bruto Fab (USD):</label>
            <input type="number" id="fab-valor" placeholder="Ex: 100.00">
        </div>
        
        <div class="section-title">Taxa de Câmbio</div>
        <div class="cambio-area">
            <div class="cambio-input">
                <label for="cambio-manual">USD → BRL:</label>
                <input type="number" id="cambio-manual" value="5.20" step="0.01">
                <div class="status-msg" id="cambio-status"></div>
            </div>
            <button class="atualizar-btn" onclick="obterTaxaCambio()">Atualizar</button>
        </div>
        
        <div class="info-box">
            <p><strong>Taxas:</strong> Unity Store <span class="fee-info">30%</span> | Fab <span class="fee-info">12%</span> | Transferência <span class="fee-info">2%</span></p>
        </div>
        
        <button onclick="calcular()">Calcular</button>
        
        <div class="result-total" id="resultado-total" style="display:none">
            <h2>Valor Total Final</h2>
            <div class="total-value">
                <div>USD: <span id="total-usd"></span></div>
                <div>BRL: <span id="total-brl"></span></div>
            </div>
            <button class="details-toggle" onclick="toggleDetalhes()">Ver detalhes por loja</button>
        </div>
        
        <div id="detalhes-container" class="hidden">
            <div class="result" id="resultado-unity-area" style="display:none">
                <div class="section-title" style="margin-top:0">Detalhes Unity</div>
                <div id="unity-detalhes-texto"></div>
            </div>
            
            <div class="result" id="resultado-fab-area" style="display:none">
                <div class="section-title" style="margin-top:0">Detalhes Fab</div>
                <div id="fab-detalhes-texto"></div>
            </div>
            <button class="details-toggle" onclick="toggleDetalhes()">Ocultar detalhes</button>
        </div>
    </div>

    <script>
        const TAXA_UNITY_STORE = 30; 
        const TAXA_FAB = 12;
        const TAXA_TRANSFERENCIA = 2;

        async function obterTaxaCambio() {
            const statusEl = document.getElementById('cambio-status');
            try {
                statusEl.textContent = "Atualizando...";
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                if (data && data.rates && data.rates.BRL) {
                    document.getElementById('cambio-manual').value = data.rates.BRL.toFixed(2);
                    statusEl.textContent = `Atualizado: ${new Date().toLocaleTimeString()}`;
                    statusEl.className = "status-msg success";
                }
            } catch (e) {
                statusEl.textContent = "Erro ao atualizar. Use valor manual.";
                statusEl.className = "status-msg warning";
            }
        }

        function toggleDetalhes() {
            const container = document.getElementById('detalhes-container');
            container.classList.toggle('hidden');
        }

        function calcular() {
            const taxaCambio = parseFloat(document.getElementById('cambio-manual').value) || 5.20;
            
            // --- CÁLCULO UNITY ---
            const unityInput = parseFloat(document.getElementById('unity-valor').value) || 0;
            const unityTipo = document.getElementById('unity-tipo').value;
            
            let valorPosUnityStore = unityInput;
            let descontoUnityStore = 0;

            if (unityTipo === "bruto" && unityInput > 0) {
                descontoUnityStore = unityInput * (TAXA_UNITY_STORE / 100);
                valorPosUnityStore = unityInput - descontoUnityStore;
            }

            const taxaTransfUnity = valorPosUnityStore * (TAXA_TRANSFERENCIA / 100);
            const liquidoUnityUSD = valorPosUnityStore - taxaTransfUnity;
            const liquidoUnityBRL = liquidoUnityUSD * taxaCambio;

            // --- CÁLCULO FAB ---
            const fabInput = parseFloat(document.getElementById('fab-valor').value) || 0;
            const descontoFab = fabInput * (TAXA_FAB / 100);
            const valorPosFab = fabInput - descontoFab;
            const taxaTransfFab = valorPosFab * (TAXA_TRANSFERENCIA / 100);
            const liquidoFabUSD = valorPosFab - taxaTransfFab;
            const liquidoFabBRL = liquidoFabUSD * taxaCambio;

            // --- TOTAIS ---
            const totalUSD = liquidoUnityUSD + liquidoFabUSD;
            const totalBRL = liquidoUnityBRL + liquidoFabBRL;

            // --- EXIBIÇÃO ---
            if (unityInput > 0 || fabInput > 0) {
                document.getElementById('total-usd').textContent = `$${totalUSD.toFixed(2)}`;
                document.getElementById('total-brl').textContent = `R$${totalBRL.toFixed(2)}`;
                document.getElementById('resultado-total').style.display = 'block';

                // Detalhes Unity
                if (unityInput > 0) {
                    let htmlUnity = `<p>Entrada: $${unityInput.toFixed(2)}</p>`;
                    if(unityTipo === "bruto") htmlUnity += `<p>Taxa Unity (30%): -$${descontoUnityStore.toFixed(2)}</p>`;
                    htmlUnity += `<p>Taxa Transf. (2%): -$${taxaTransfUnity.toFixed(2)}</p>`;
                    htmlUnity += `<p><strong>Líquido: $${liquidoUnityUSD.toFixed(2)} | R$${liquidoUnityBRL.toFixed(2)}</strong></p>`;
                    document.getElementById('unity-detalhes-texto').innerHTML = htmlUnity;
                    document.getElementById('resultado-unity-area').style.display = 'block';
                } else {
                    document.getElementById('resultado-unity-area').style.display = 'none';
                }

                // Detalhes Fab
                if (fabInput > 0) {
                    let htmlFab = `
                        <p>Bruto Fab: $${fabInput.toFixed(2)}</p>
                        <p>Taxa Fab (12%): -$${descontoFab.toFixed(2)}</p>
                        <p>Taxa Transf. (2%): -$${taxaTransfFab.toFixed(2)}</p>
                        <p><strong>Líquido: $${liquidoFabUSD.toFixed(2)} | R$${liquidoFabBRL.toFixed(2)}</strong></p>
                    `;
                    document.getElementById('fab-detalhes-texto').innerHTML = htmlFab;
                    document.getElementById('resultado-fab-area').style.display = 'block';
                } else {
                    document.getElementById('resultado-fab-area').style.display = 'none';
                }
            }
            document.getElementById('detalhes-container').classList.add('hidden');
        }

        window.onload = obterTaxaCambio;
    </script>
</body>
</html>
