<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Unity/Fab Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .calculator {
            background-color: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #1b5e20;
        }
        .section-title {
            font-weight: 700;
            color: #2e7d32;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .cambio-container {
            display: flex;
            flex-direction: column;
        }
        .cambio-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .cambio-row input {
            flex: 1;
        }
        .btn-refresh {
            width: 50px;
            background: #eee;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-refresh:hover { background: #e0e0e0; }

        .extra-deduction {
            background-color: #fff5f5;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #ffcdd2;
            margin-top: 10px;
        }
        .help-text {
            font-size: 11px;
            color: #c62828;
            margin-top: 4px;
            font-weight: 600;
        }
        button.main-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
        }
        button.main-btn:active { transform: translateY(1px); }

        .result-card {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
        .total-brl { font-size: 32px; font-weight: 800; margin: 5px 0; }
        .total-usd { font-size: 16px; opacity: 0.9; }

        .details-box {
            margin-top: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            font-size: 13px;
            display: none;
        }
        .detail-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        .hidden { display: none; }
        .success-text { color: #4CAF50; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="calculator">
    <h1>Calculadora Unity/Fab</h1>

    <div class="section-title">Unity Asset Store</div>
    <div class="input-group">
        <label>Estado do Valor:</label>
        <select id="u-tipo" onchange="toggleExtra()">
            <option value="liquido">Valor Líquido</option>
            <option value="bruto">Valor Bruto</option>
        </select>
    </div>
    <div class="input-group">
        <label>Valor em USD:</label>
        <input type="number" id="u-valor" placeholder="0.00" step="0.01">
    </div>

    <div id="u-extra-container" class="extra-deduction hidden">
        <label>Subtrair Valor (USD):</label>
        <input type="number" id="u-extra" placeholder="0.00" step="0.01">
        <div class="help-text">O valor acima será subtraído ANTES dos 30% da Unity.</div>
    </div>

    <div class="section-title">Fab (Epic Games)</div>
    <div class="input-group">
        <label>Valor Bruto na Fab (USD):</label>
        <input type="number" id="f-valor" placeholder="0.00" step="0.01">
    </div>

    <div class="section-title">Configurações de Câmbio</div>
    <div class="cambio-container">
        <label>Cotação USD → BRL:</label>
        <div class="cambio-row">
            <input type="number" id="cambio" value="5.20" step="0.01">
            <button class="btn-refresh" onclick="getExchange()" title="Atualizar Câmbio">🔄</button>
        </div>
        <div id="cambio-status" class="success-text"></div>
    </div>

    <button class="main-btn" onclick="calculate()">CALCULAR RECEBIMENTO</button>

    <div id="result-card" class="result-card">
        <div style="font-size: 12px; text-transform: uppercase;">Total a Receber</div>
        <div class="total-brl" id="res-brl">R$ 0,00</div>
        <div class="total-usd" id="res-usd">$ 0.00 USD</div>
        <div style="margin-top:10px; font-size: 11px; cursor:pointer; text-decoration: underline;" onclick="toggleDetails()">Ver demonstrativo detalhado</div>
    </div>

    <div id="details-box" class="details-box">
        <div id="details-content"></div>
    </div>
</div>

<script>
    function toggleExtra() {
        const isBruto = document.getElementById('u-tipo').value === 'bruto';
        document.getElementById('u-extra-container').classList.toggle('hidden', !isBruto);
    }

    async function getExchange() {
        const status = document.getElementById('cambio-status');
        status.textContent = "Buscando...";
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            document.getElementById('cambio').value = data.rates.BRL.toFixed(2);
            status.textContent = "Cotação atualizada em " + new Date().toLocaleTimeString();
        } catch (e) {
            status.textContent = "Erro ao atualizar. Insira manualmente.";
        }
    }

    function toggleDetails() {
        const box = document.getElementById('details-box');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function calculate() {
        const cambio = parseFloat(document.getElementById('cambio').value) || 0;
        
        // --- LÓGICA UNITY ---
        const uInput = parseFloat(document.getElementById('u-valor').value) || 0;
        const uTipo = document.getElementById('u-tipo').value;
        const uExtra = parseFloat(document.getElementById('u-extra').value) || 0;
        
        let uBaseAposDeducao = uInput;
        let uStoreFee = 0;

        if (uTipo === 'bruto' && uInput > 0) {
            // 1. Subtrai o valor específico primeiro
            uBaseAposDeducao = uInput - uExtra;
            // 2. Calcula os 30% sobre o que sobrou
            uStoreFee = uBaseAposDeducao * 0.30;
        }
        
        // 3. Valor após a loja
        let uPosStore = uBaseAposDeducao - uStoreFee;
        // 4. Taxa de transferência de 2%
        let uTransfFee = uPosStore * 0.02;
        let uFinalUSD = Math.max(0, uPosStore - uTransfFee);

        // --- LÓGICA FAB ---
        const fVal = parseFloat(document.getElementById('f-valor').value) || 0;
        let fStoreFee = fVal * 0.12;
        let fPosStore = fVal - fStoreFee;
        let fTransfFee = fPosStore * 0.02;
        let fFinalUSD = Math.max(0, fPosStore - fTransfFee);

        // --- TOTAIS ---
        const totalUSD = uFinalUSD + fFinalUSD;
        const totalBRL = totalUSD * cambio;

        // --- EXIBIÇÃO ---
        document.getElementById('result-card').style.display = 'block';
        document.getElementById('res-brl').textContent = "R$ " + totalBRL.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        document.getElementById('res-usd').textContent = "$ " + totalUSD.toFixed(2) + " USD";

        let html = `<strong>DEMONSTRATIVO:</strong><br><br>`;
        if(uInput > 0) {
            html += `<b>Unity Store:</b><br>
            <div class="detail-line"><span>Entrada Bruta</span> <span>$${uInput.toFixed(2)}</span></div>
            ${uExtra > 0 ? `<div class="detail-line"><span>Dedução Pré-Taxa</span> <span style="color:red">-$${uExtra.toFixed(2)}</span></div>` : ''}
            ${uStoreFee > 0 ? `<div class="detail-line"><span>Comissão Unity (30%)</span> <span style="color:red">-$${uStoreFee.toFixed(2)}</span></div>` : ''}
            <div class="detail-line"><span>Transferência (2%)</span> <span style="color:red">-$${uTransfFee.toFixed(2)}</span></div>
            <div class="detail-line"><b>Líquido Unity</b> <b>$${uFinalUSD.toFixed(2)}</b></div><br>`;
        }
        if(fVal > 0) {
            html += `<b>Fab:</b><br>
            <div class="detail-line"><span>Entrada Bruta</span> <span>$${fVal.toFixed(2)}</span></div>
            <div class="detail-line"><span>Taxa Fab (12%)</span> <span style="color:red">-$${fStoreFee.toFixed(2)}</span></div>
            <div class="detail-line"><span>Transferência (2%)</span> <span style="color:red">-$${fTransfFee.toFixed(2)}</span></div>
            <div class="detail-line"><b>Líquido Fab</b> <b>$${fFinalUSD.toFixed(2)}</b></div>`;
        }
        document.getElementById('details-content').innerHTML = html;
    }

    window.onload = getExchange;
</script>

</body>
</html>
