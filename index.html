<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ganhos Unity/Fab</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f2f5;
        }
        .calculator {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a1a1a;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .section-title {
            margin-top: 20px;
            font-weight: bold;
            color: #2e7d32;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
        }
        .extra-deduction-container {
            background-color: #fff3f3;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px dashed #e53935;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #439647;
        }
        .result-total {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f5e9;
            border-radius: 8px;
            text-align: center;
        }
        .total-value {
            font-size: 28px;
            font-weight: 800;
            color: #2e7d32;
            margin: 10px 0;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
        }
        .cambio-area {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .status-msg {
            font-size: 11px;
            margin-top: 4px;
        }
        .success { color: #4CAF50; }
        .warning { color: #ff9800; }
        .hidden { display: none; }
        .details-toggle {
            background: none;
            border: none;
            color: #666;
            text-decoration: underline;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Calculadora Unity/Fab</h1>
        
        <div class="section-title">Unity Asset Store</div>
        <div class="input-group">
            <label for="unity-tipo">Estado do Valor:</label>
            <select id="unity-tipo" onchange="toggleExtraUnity()">
                <option value="bruto">Valor Bruto</option>
                <option value="liquido" selected>Valor Líquido</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="unity-valor">Valor USD:</label>
            <input type="number" id="unity-valor" placeholder="0.00">
        </div>

        <div id="unity-extra-field" class="input-group extra-deduction-container hidden">
            <label for="unity-deducao-especifica">Subtrair valor específico (USD):</label>
            <input type="number" id="unity-deducao-especifica" placeholder="Ex: Imposto retido ou taxa fixa">
        </div>
        
        <div class="section-title">Fab (Epic Games)</div>
        <div class="input-group">
            <label for="fab-valor">Valor Bruto Fab (USD):</label>
            <input type="number" id="fab-valor" placeholder="0.00">
        </div>
        
        <div class="section-title">Câmbio</div>
        <div class="cambio-area">
            <div style="flex: 1;">
                <label for="cambio-manual">USD → BRL:</label>
                <input type="number" id="cambio-manual" value="5.20" step="0.01">
                <div class="status-msg" id="cambio-status"></div>
            </div>
            <button onclick="obterTaxaCambio()" style="width: auto; margin-top: 0; padding: 10px;">🔄</button>
        </div>
        
        <button onclick="calcular()">CALCULAR GANHOS</button>
        
        <div class="result-total" id="resultado-total" style="display:none">
            <div style="font-size: 14px; color: #666;">Total Estimado</div>
            <div class="total-value" id="total-brl">R$ 0,00</div>
            <div style="font-weight: bold; color: #444;" id="total-usd">$ 0.00</div>
            <button class="details-toggle" onclick="toggleDetalhes()">Ver demonstrativo detalhado</button>
        </div>
        
        <div id="detalhes-container" class="hidden">
            <div class="result" id="res-unity" style="display:none"></div>
            <div class="result" id="res-fab" style="display:none"></div>
        </div>
    </div>

    <script>
        const TAXA_UNITY_STORE = 0.30; 
        const TAXA_FAB = 0.12;
        const TAXA_TRANSFERENCIA = 0.02;

        function toggleExtraUnity() {
            const tipo = document.getElementById('unity-tipo').value;
            const extraField = document.getElementById('unity-extra-field');
            if (tipo === 'bruto') {
                extraField.classList.remove('hidden');
            } else {
                extraField.classList.add('hidden');
            }
        }

        async function obterTaxaCambio() {
            const statusEl = document.getElementById('cambio-status');
            try {
                statusEl.textContent = "Buscando...";
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                if (data && data.rates.BRL) {
                    document.getElementById('cambio-manual').value = data.rates.BRL.toFixed(2);
                    statusEl.textContent = "Taxa atualizada com sucesso!";
                    statusEl.className = "status-msg success";
                }
            } catch (e) {
                statusEl.textContent = "Erro na API. Insira manualmente.";
                statusEl.className = "status-msg warning";
            }
        }

        function toggleDetalhes() {
            document.getElementById('detalhes-container').classList.toggle('hidden');
        }

        function calcular() {
            const cambio = parseFloat(document.getElementById('cambio-manual').value) || 1;
            
            // Unity Logic
            const uInput = parseFloat(document.getElementById('unity-valor').value) || 0;
            const uTipo = document.getElementById('unity-tipo').value;
            const uDeducao = parseFloat(document.getElementById('unity-deducao-especifica').value) || 0;
            
            let uBase = uInput;
            let uStoreFee = 0;
            
            if (uTipo === 'bruto') {
                uStoreFee = uInput * TAXA_UNITY_STORE;
                uBase = uInput - uStoreFee - uDeducao;
            }
            
            const uTransfFee = uBase * TAXA_TRANSFERENCIA;
            const uLiquidoUSD = uBase - uTransfFee;

            // Fab Logic
            const fInput = parseFloat(document.getElementById('fab-valor').value) || 0;
            const fStoreFee = fInput * TAXA_FAB;
            const fBase = fInput - fStoreFee;
            const fTransfFee = fBase * TAXA_TRANSFERENCIA;
            const fLiquidoUSD = fBase - fTransfFee;

            // Totals
            const totalUSD = uLiquidoUSD + fLiquidoUSD;
            const totalBRL = totalUSD * cambio;

            // Display
            if (uInput > 0 || fInput > 0) {
                document.getElementById('resultado-total').style.display = 'block';
                document.getElementById('total-brl').textContent = `R$ ${totalBRL.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                document.getElementById('total-usd').textContent = `$ ${totalUSD.toFixed(2)} USD`;

                // Details Unity
                const resU = document.getElementById('res-unity');
                if (uInput > 0) {
                    resU.style.display = 'block';
                    resU.innerHTML = `<strong>Detalhes Unity:</strong><br>
                        Entrada: $${uInput.toFixed(2)}<br>
                        ${uStoreFee > 0 ? `Taxa Store (30%): -$${uStoreFee.toFixed(2)}<br>` : ''}
                        ${uDeducao > 0 ? `Dedução Extra: -$${uDeducao.toFixed(2)}<br>` : ''}
                        Taxa Transferência (2%): -$${uTransfFee.toFixed(2)}<br>
                        <strong>Líquido Unity: $${uLiquidoUSD.toFixed(2)}</strong>`;
                } else { resU.style.display = 'none'; }

                // Details Fab
                const resF = document.getElementById('res-fab');
                if (fInput > 0) {
                    resF.style.display = 'block';
                    resF.innerHTML = `<strong>Detalhes Fab:</strong><br>
                        Bruto: $${fInput.toFixed(2)}<br>
                        Taxa Fab (12%): -$${fStoreFee.toFixed(2)}<br>
                        Taxa Transferência (2%): -$${fTransfFee.toFixed(2)}<br>
                        <strong>Líquido Fab: $${fLiquidoUSD.toFixed(2)}</strong>`;
                } else { resF.style.display = 'none'; }
            }
        }

        window.onload = obterTaxaCambio;
    </script>
</body>
</html>
